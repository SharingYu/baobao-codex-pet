<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>包包与菲菲</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main id="app" aria-label="包包与菲菲桌面宠物">
      <canvas
        id="pet-stage"
        tabindex="0"
        aria-label="透明桌面宠物舞台，可点击摸摸或按住拖动宠物"
      ></canvas>

      <div id="quiet-status" class="quiet-status" role="status" hidden>
        <span class="quiet-dot" aria-hidden="true"></span>
        安静陪伴中
      </div>

      <section id="action-shell" class="action-shell" aria-label="宠物互动">
        <div id="food-popover" class="popover" role="dialog" aria-label="选择食物" hidden>
          <p class="popover-title">给谁都可以，拖出来也行</p>
          <div class="choice-row">
            <button class="choice" type="button" data-food="fish" draggable="false">
              <span class="choice-icon food-fish" aria-hidden="true"></span>
              <span>小鱼干</span>
            </button>
            <button class="choice" type="button" data-food="cube" draggable="false">
              <span class="choice-icon food-cube" aria-hidden="true"></span>
              <span>冻干</span>
            </button>
            <button class="choice" type="button" data-food="can" draggable="false">
              <span class="choice-icon food-can" aria-hidden="true"></span>
              <span>罐罐</span>
            </button>
          </div>
        </div>

        <div id="toy-popover" class="popover" role="dialog" aria-label="选择玩具" hidden>
          <p class="popover-title">陪它们玩一小会儿</p>
          <div class="choice-row">
            <button class="choice" type="button" data-toy="ball">
              <span class="choice-icon toy-ball" aria-hidden="true"></span>
              <span>小球</span>
            </button>
            <button class="choice" type="button" data-toy="wand">
              <span class="choice-icon toy-wand" aria-hidden="true"></span>
              <span>逗猫棒</span>
            </button>
            <button class="choice" type="button" data-toy="box">
              <span class="choice-icon toy-box" aria-hidden="true"></span>
              <span>纸箱</span>
            </button>
          </div>
        </div>

        <div id="petpack-popover" class="popover petpack-popover" role="dialog" aria-label="宠物包管理" hidden>
          <p class="popover-title">把定制好的宠物带进来</p>
          <button id="import-petpack-button" class="import-petpack-button" type="button">
            <span class="import-mark" aria-hidden="true">＋</span>
            <span><strong>导入宠物包</strong><small>.petpack 定制宠物包</small></span>
          </button>
        </div>

        <nav class="action-bar" aria-label="快捷操作">
          <button id="pet-button" class="action-button" type="button" data-action="pet">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M8.4 10.3c1.2-1.1 2.8-.4 3.6.7.8-1.1 2.4-1.8 3.6-.7 1.5 1.4.6 3.8-3.6 6.4-4.2-2.6-5.1-5-3.6-6.4Z" />
              <path d="M5.2 7.7c.8-.8 2-.4 2.4.6M16.4 8.3c.4-1 1.6-1.4 2.4-.6" />
            </svg>
            <span>摸摸</span>
          </button>
          <button id="feed-button" class="action-button" type="button" data-action="feed" aria-expanded="false">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4.8 12.5h14.4c-.2 4-3.1 6.4-7.2 6.4s-7-2.4-7.2-6.4Z" />
              <path d="M8.1 9.8c.5-2 2.1-3.4 4.1-3.4 1.6 0 3 .8 3.7 2.2" />
            </svg>
            <span>投喂</span>
          </button>
          <button id="toy-button" class="action-button" type="button" data-action="toy" aria-expanded="false">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="8" cy="14.5" r="3.7" />
              <path d="M10.8 12c2.1-2.3 3.8-4.8 4.3-7.4M15.1 4.6c1.2.4 2.2 1.2 2.9 2.3" />
            </svg>
            <span>玩具</span>
          </button>
          <button id="quiet-button" class="action-button" type="button" data-action="quiet" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M17.7 14.9A6.8 6.8 0 0 1 9.1 6.3a6.9 6.9 0 1 0 8.6 8.6Z" />
            </svg>
            <span>安静</span>
          </button>
          <span class="bar-divider" aria-hidden="true"></span>
          <button id="petpack-button" class="petpack-button" type="button" aria-label="导入宠物包" aria-expanded="false" title="导入宠物包">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 5v9M8.5 10.5 12 14l3.5-3.5M6 16.5v1.2c0 .7.6 1.3 1.3 1.3h9.4c.7 0 1.3-.6 1.3-1.3v-1.2" />
            </svg>
          </button>
        </nav>
      </section>

      <aside id="guide" class="guide-card" role="dialog" aria-labelledby="guide-title" hidden>
        <div class="guide-progress" aria-hidden="true">
          <span></span><span></span><span></span><span></span>
        </div>
        <p id="guide-kicker" class="guide-kicker">第一次见面</p>
        <h1 id="guide-title">先和它们打个招呼</h1>
        <p id="guide-copy">点击猫咪就是摸摸；按住拖动，可以把它们搬到喜欢的位置。</p>
        <div class="guide-actions">
          <button id="guide-skip" class="text-button" type="button">跳过</button>
          <button id="guide-next" class="primary-button" type="button">下一步</button>
        </div>
      </aside>

      <div id="toast-stack" class="toast-stack" aria-live="polite" aria-atomic="true"></div>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
